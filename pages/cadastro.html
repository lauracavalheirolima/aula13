<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - estter</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <h1>estter</h1>
        <nav>
            <a href="../index.html">Home</a>
            <a href="login.html">Entrar</a>
        </nav>
    </header>
    <main class="cadastro">
        <section>
            <h2>Cadastro</h2>
            <p>Preencha os campos para criar sua conta.</p>
            <form action="login.html" method="get">
                <label for="nome">Nome completo:</label>
                <input type="text" id="nome" name="nome" required>
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" required>
                <label for="confirmar-senha">Confirmar senha:</label>
                <input type="password" id="confirmar-senha" name="confirmar-senha" required>
                <label for="rg">RG:</label>
                <input type="text" id="rg" name="rg" required>
                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" name="cpf" required>
                <label for="endereco">Endereço:</label>
                <input type="text" id="endereco" name="endereco" required>
                <label for="cep">CEP:</label>
                <input type="text" id="cep" name="cep" required>
                <label for="cidade">Cidade:</label>
                <input type="text" id="cidade" name="cidade" required>
                <label for="estado">Estado:</label>
                <input type="text" id="estado" name="estado" required>
                <label for="pais">País:</label>
                <input type="text" id="pais" name="pais" value="Brasil" required>
                <label for="nascimento">Data de nascimento:</label>
                <input type="date" id="nascimento" name="nascimento" required>
                <button type="submit">Cadastrar</button>
            </form>
            <p>Já tem uma conta? <a href="login.html">Faça login</a></p>
            <p><a href="../index.html">Voltar para a Home</a></p>
        </section>
    </main>
    <footer><p>&copy; 2026 estter</p></footer>
</body>
</html>
