<!DOCTYPE html>
<html lang="pt-BR">

    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <h1>estter</h1>
        <nav>
            <a href="../index.html">Home</a>
            <a href="cadastro.html">Cadastrar</a>
        </nav>
    </header>
    <main class="pagina-formulario">
        <img class="imagem-formulario" src="https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=700&q=80" alt="Pessoas olhando roupas em uma loja">
        <section class="formulario">
            <h2>Entrar na conta</h2>
            <p>Informe seus dados para continuar.</p>
            <form action="#" method="get">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" required>
                <button type="submit">Entrar</button>
            </form>
            <p><a href="esqueci-senha.html">Esqueci minha senha</a></p>
            <p>Não tem cadastro? <a href="cadastro.html">Cadastre-se</a></p>
            <p><a href="../index.html">Voltar para a Home</a></p>
        </section>
    </main>
    <footer><p>&copy; 2026 estter</p></footer>

</html>
